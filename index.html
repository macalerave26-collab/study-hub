<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Will You? 💗</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff0f6);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    text-align: center;
    background: rgba(255,255,255,0.85);
    padding: 40px 25px;
    border-radius: 25px;
    width: min(90%, 500px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}

.heart {
    font-size: 70px;
    animation: heartbeat 1.2s infinite;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.15);
    }
}

h1 {
    color: #d6336c;
    font-size: 32px;
}

p {
    color: #777;
    font-size: 17px;
}

.buttons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#yes {
    background: #ff4f87;
    color: white;
}

#yes:hover {
    transform: scale(1.08);
}

#no {
    background: #ddd;
    color: #333;
    position: relative;
    transition: left 0.15s, top 0.15s;
}

#message {
    margin-top: 25px;
    font-size: 20px;
    font-weight: bold;
    color: #d6336c;
}

.hidden {
    display: none;
}

.confetti {
    position: fixed;
    font-size: 25px;
    animation: fall 3s linear forwards;
    pointer-events: none;
}

@keyframes fall {
    from {
        transform: translateY(-50px) rotate(0deg);
        opacity: 1;
    }

    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container" id="main">

    <div class="heart">💗</div>

    <h1>Will you be my girlfriend?</h1>

    <p>👉 Choose wisely... 👈</p>

    <div class="buttons">

        <button id="yes" onclick="sayYes()">
            YES 💕
        </button>

        <button id="no">
            NO 😭
        </button>

    </div>

    <div id="message"></div>

</div>


<div class="container hidden" id="success">

    <div class="heart">🥰</div>

    <h1>YAY!!! 💕</h1>

    <p>You said yes! 🎉</p>

</div>


<script>

const noButton = document.getElementById("no");

let attempts = 0;


/* Make the button dodge the mouse */
noButton.addEventListener("mouseenter", dodge);


/* Also works with touch */
noButton.addEventListener("touchstart", function(event) {
    event.preventDefault();
    dodge();
});


function dodge() {

    attempts++;

    /*
       After several dodges, let the person
       actually choose NO.
    */
    if (attempts >= 20) {

        noButton.innerText = "Okay... NO 😭";

        noButton.style.position = "static";

        noButton.onclick = sayNo;

        return;
    }

    const padding = 20;

    const maxX =
        window.innerWidth -
        noButton.offsetWidth -
        padding;

    const maxY =
        window.innerHeight -
        noButton.offsetHeight -
        padding;

    const x =
        Math.max(
            padding,
            Math.random() * maxX
        );

    const y =
        Math.max(
            padding,
            Math.random() * maxY
        );

    noButton.style.position = "fixed";

    noButton.style.left = x + "px";
    noButton.style.top = y + "px";

    const messages = [
        "HEY! 😭",
        "Nice try 😂",
        "NOPE!",
        "You almost got me 😭",
        "STOP CHASING ME 💀"
    ];

    document.getElementById("message").innerText =
        messages[Math.floor(Math.random() * messages.length)];
}


function sayYes() {

    document.getElementById("main")
        .classList.add("hidden");

    document.getElementById("success")
        .classList.remove("hidden");

    createConfetti();

}


function sayNo() {

    document.getElementById("message").innerText =
        "Okay 😭 I respect your answer.";

}


function createConfetti() {

    const emojis = [
        "💗",
        "💕",
        "💖",
        "✨",
        "🎉",
        "💝"
    ];

    for (let i = 0; i < 40; i++) {

        const piece =
            document.createElement("div");

        piece.className = "confetti";

        piece.innerText =
            emojis[Math.floor(
                Math.random() * emojis.length
            )];

        piece.style.left =
            Math.random() * 100 + "vw";

        piece.style.animationDelay =
            Math.random() * 1.5 + "s";

        document.body.appendChild(piece);

        setTimeout(() => {
            piece.remove();
        }, 4000);
    }

}

</script>

</body>
</html>
