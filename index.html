<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuckyRoll</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #26345f 0%, #11152b 45%, #080a14 100%);
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 28px 15px 18px;
}

.logo {
    font-size: 38px;
    font-weight: 900;
}

.subtitle {
    color: #aeb8dd;
    margin-top: 6px;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 15px;
}

.panel {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 15px;
    backdrop-filter: blur(10px);
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 15px;
}

.stat {
    background: rgba(255,255,255,0.07);
    border-radius: 15px;
    padding: 14px 5px;
    text-align: center;
}

.stat-number {
    font-size: 22px;
    font-weight: bold;
}

.stat-label {
    font-size: 12px;
    color: #aeb8dd;
    margin-top: 4px;
}

button {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 15px;
    margin-top: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: #ffffff;
    color: #11152b;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.98);
}

.roll-button {
    font-size: 20px;
    padding: 18px;
}

.secondary {
    background: rgba(255,255,255,0.1);
    color: white;
}

.hidden {
    display: none !important;
}

.result-card {
    text-align: center;
    min-height: 250px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.reward-icon {
    font-size: 75px;
    margin-bottom: 10px;
}

.reward-name {
    font-size: 27px;
    font-weight: 900;
}

.rarity {
    margin-top: 8px;
    font-size: 17px;
    font-weight: bold;
}

.common {
    color: #bfc7d9;
}

.uncommon {
    color: #65e6a8;
}

.rare {
    color: #66a8ff;
}

.epic {
    color: #bd79ff;
}

.legendary {
    color: #ffd45c;
}

.mythic {
    color: #ff72c8;
}

.reveal {
    animation: reveal 0.6s ease;
}

@keyframes reveal {
    0% {
        transform: scale(0.4) rotate(-8deg);
        opacity: 0;
    }

    60% {
        transform: scale(1.12) rotate(3deg);
    }

    100% {
        transform: scale(1) rotate(0);
        opacity: 1;
    }
}

.collection-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.item {
    background: rgba(255,255,255,0.06);
    border-radius: 15px;
    padding: 13px 5px;
    text-align: center;
    min-height: 105px;
}

.item-icon {
    font-size: 34px;
}

.item-name {
    font-size: 12px;
    margin-top: 5px;
}

.item-count {
    font-size: 11px;
    color: #9da8d0;
    margin-top: 3px;
}

.locked {
    opacity: 0.3;
    filter: grayscale(1);
}

.progress-bar {
    height: 12px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 10px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: white;
    transition: width 0.5s;
}

.section-title {
    margin-top: 0;
}

.message {
    text-align: center;
    color: #aeb8dd;
    min-height: 22px;
}

.streak {
    text-align: center;
    font-size: 16px;
    margin: 10px 0;
}

.big-streak {
    font-size: 25px;
    font-weight: bold;
}

.footer {
    text-align: center;
    color: #697398;
    font-size: 12px;
    padding: 15px;
}

@media (max-width: 450px) {
    .logo {
        font-size: 32px;
    }

    .collection-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">✨ LuckyRoll</div>
    <div class="subtitle">Build your ultimate collection</div>
</header>

<div class="container">

    <!-- STATS -->
    <div class="stats">

        <div class="stat">
            <div class="stat-number" id="rolls">0</div>
            <div class="stat-label">ROLLS</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="bestStreak">0</div>
            <div class="stat-label">BEST STREAK</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="collectionCount">0/12</div>
            <div class="stat-label">COLLECTION</div>
        </div>

    </div>


    <!-- GAME -->
    <div class="panel">

        <div class="result-card" id="result">

            <div class="reward-icon">🎁</div>

            <div class="reward-name">
                Ready?
            </div>

            <div class="rarity">
                Roll to discover something new!
            </div>

        </div>

        <div class="streak">
            🔥 Streak:
            <span class="big-streak" id="streak">0</span>
        </div>

        <button class="roll-button" onclick="roll()">
            🎲 ROLL
        </button>

        <p class="message" id="message"></p>

    </div>


    <!-- COLLECTION -->
    <div class="panel">

        <h2 class="section-title">📖 Collection</h2>

        <p>
            <span id="progressText">0</span> / 12 discovered
        </p>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <br>

        <div class="collection-grid" id="collection"></div>

    </div>


    <!-- RESET -->
    <div class="panel">

        <button class="secondary" onclick="resetGame()">
            ♻️ Reset Progress
        </button>

    </div>

    <div class="footer">
        LuckyRoll • Your collection is saved on this device
    </div>

</div>


<script>

/* =========================
   REWARDS
========================= */

const rewards = [

    {
        name: "Tiny Star",
        icon: "⭐",
        rarity: "Common",
        className: "common",
        weight: 35
    },

    {
        name: "Blue Crystal",
        icon: "💎",
        rarity: "Common",
        className: "common",
        weight: 25
    },

    {
        name: "Lucky Leaf",
        icon: "🍀",
        rarity: "Uncommon",
        className: "uncommon",
        weight: 16
    },

    {
        name: "Golden Coin",
        icon: "🪙",
        rarity: "Uncommon",
        className: "uncommon",
        weight: 10
    },

    {
        name: "Magic Orb",
        icon: "🔮",
        rarity: "Rare",
        className: "rare",
        weight: 6
    },

    {
        name: "Ice Crown",
        icon: "👑",
        rarity: "Rare",
        className: "rare",
        weight: 3
    },

    {
        name: "Phoenix",
        icon: "🔥",
        rarity: "Epic",
        className: "epic",
        weight: 2
    },

    {
        name: "Moon Dragon",
        icon: "🐉",
        rarity: "Epic",
        className: "epic",
        weight: 1.3
    },

    {
        name: "Galaxy Core",
        icon: "🌌",
        rarity: "Legendary",
        className: "legendary",
        weight: 0.5
    },

    {
        name: "Cosmic Crown",
        icon: "👑",
        rarity: "Legendary",
        className: "legendary",
        weight: 0.2
    },

    {
        name: "Void Dragon",
        icon: "🐲",
        rarity: "Mythic",
        className: "mythic",
        weight: 0.1
    },

    {
        name: "Infinity",
        icon: "♾️",
        rarity: "Mythic",
        className: "mythic",
        weight: 0.05
    }

];


/* =========================
   SAVE DATA
========================= */

let data = JSON.parse(
    localStorage.getItem("luckyRollData")
) || {

    rolls: 0,
    streak: 0,
    bestStreak: 0,
    collection: {}

};


/* =========================
   SAVE
========================= */

function save() {

    localStorage.setItem(
        "luckyRollData",
        JSON.stringify(data)
    );

}


/* =========================
   PICK RANDOM REWARD
========================= */

function pickReward() {

    let total = rewards.reduce(
        (sum, reward) => sum + reward.weight,
        0
    );

    let random = Math.random() * total;

    for (let reward of rewards) {

        random -= reward.weight;

        if (random <= 0) {
            return reward;
        }

    }

    return rewards[0];

}


/* =========================
   ROLL
========================= */

function roll() {

    const button =
        document.querySelector(".roll-button");

    button.disabled = true;

    const result =
        document.getElementById("result");

    result.classList.remove("reveal");

    result.innerHTML = `
        <div class="reward-icon">🎲</div>
        <div class="reward-name">Rolling...</div>
        <div class="rarity">✨</div>
    `;

    setTimeout(() => {

        const reward = pickReward();

        data.rolls++;

        data.streak++;

        if (data.streak > data.bestStreak) {
            data.bestStreak = data.streak;
        }

        if (!data.collection[reward.name]) {
            data.collection[reward.name] = 0;
        }

        data.collection[reward.name]++;

        save();

        result.classList.add("reveal");

        result.innerHTML = `
            <div class="reward-icon">
                ${reward.icon}
            </div>

            <div class="reward-name">
                ${reward.name}
            </div>

            <div class="rarity ${reward.className}">
                ${reward.rarity}
            </div>
        `;

        document.getElementById("message").innerText =
            "✨ You discovered " + reward.name + "!";

        update();

        button.disabled = false;

    }, 700);

}


/* =========================
   UPDATE UI
========================= */

function update() {

    document.getElementById("rolls").innerText =
        data.rolls;

    document.getElementById("streak").innerText =
        data.streak;

    document.getElementById("bestStreak").innerText =
        data.bestStreak;

    const discovered =
        rewards.filter(
            reward => data.collection[reward.name]
        ).length;

    document.getElementById("collectionCount").innerText =
        discovered + "/12";

    document.getElementById("progressText").innerText =
        discovered;

    document.getElementById("progressFill").style.width =
        (discovered / rewards.length * 100) + "%";

    renderCollection();

}


/* =========================
   COLLECTION
========================= */

function renderCollection() {

    const container =
        document.getElementById("collection");

    container.innerHTML = "";

    rewards.forEach(reward => {

        const count =
            data.collection[reward.name] || 0;

        const div =
            document.createElement("div");

        div.className =
            "item" + (count === 0 ? " locked" : "");

        div.innerHTML = `

            <div class="item-icon">
                ${count > 0 ? reward.icon : "❔"}
            </div>

            <div class="item-name">
                ${count > 0 ? reward.name : "Undiscovered"}
            </div>

            <div class="item-count">
                ${count > 0 ? "×" + count : "???"}
            </div>

        `;

        container.appendChild(div);

    });

}


/* =========================
   RESET
========================= */

function resetGame() {

    const confirmReset =
        confirm(
            "Reset your entire LuckyRoll collection?"
        );

    if (!confirmReset) return;

    data = {
        rolls: 0,
        streak: 0,
        bestStreak: 0,
        collection: {}
    };

    save();

    document.getElementById("result").innerHTML = `
        <div class="reward-icon">🎁</div>
        <div class="reward-name">Ready?</div>
        <div class="rarity">
            Roll to discover something new!
        </div>
    `;

    document.getElementById("message").innerText = "";

    update();

}


/* =========================
   START
========================= */

update();

</script>

</body>
</html>
</script>

</body>
</html>
